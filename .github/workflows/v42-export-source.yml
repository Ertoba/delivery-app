name: V42 Export Source

on:
  push:
    branches: [upgrade-v42-20261002]
    paths: ['.github/workflows/v42-export-source.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f03b4cf1cccf450294773562431ad90374067caf
      - name: Pack baseline source
        run: |
          tar --exclude=.git --exclude=.dart_tool --exclude=build -czf /tmp/delivery-app-v42-baseline.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-app-v42-baseline
          path: /tmp/delivery-app-v42-baseline.tar.gz
          retention-days: 1
