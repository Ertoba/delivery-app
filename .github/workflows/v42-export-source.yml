name: V42 Export Source

on:
  push:
    branches: [upgrade-v42-20261002]
    paths: ['.github/workflows/v42-export-source.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-v42-20261002
      - name: Pack source
        run: |
          tar --exclude=.git --exclude=.dart_tool --exclude=build -czf /tmp/delivery-app-upgrade-v42-current.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-app-upgrade-v42-current
          path: /tmp/delivery-app-upgrade-v42-current.tar.gz
          retention-days: 1
