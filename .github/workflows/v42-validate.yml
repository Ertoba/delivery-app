name: V42 Delivery Validation

on:
  push:
    branches: [upgrade-v42-20261002]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space and remove archived source copies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          rm -rf "Delivery Man App" || true
          rm -rf third_party/**/example third_party/**/test third_party/**/test_driver third_party/**/pigeons || true
          df -h
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug
      - name: Promote validated V4.2 source to main
        if: ${{ hashFiles('.mili-v42-source-merged') != '' }}
        run: |
          grep -Fxq 'MILI-V42-SOURCE-MERGED-20261002' .mili-v42-source-merged
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
