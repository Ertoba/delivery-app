name: Production QA Audit

on:
  push:
    branches: ["main", "audit/production-qa-2026-09-06"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest audit for a branch needs to consume the hosted runner.
concurrency:
  group: delivery-production-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # GitHub hosted runners include large optional toolchains which are not
      # needed by this Flutter / Android build. Remove them before provisioning
      # Flutter and Gradle to avoid Jetifier failing with ENOSPC.
      - name: Reclaim disk space for Flutter Android QA
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup"
          df -h /
          for directory in /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -d "$directory" ]; then
              sudo rm -rf -- "$directory"
            fi
          done
          echo "Disk after cleanup"
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.5"
          cache: true
      - name: Environment
        run: |
          flutter --version
          dart --version
      - name: Dependencies
        run: flutter pub get
      - name: Static UI inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          files=list(Path('lib').rglob('*.dart'))
          text={p.as_posix():p.read_text(encoding='utf-8',errors='ignore') for p in files}
          def n(rx): return sum(len(re.findall(rx,s,re.I|re.M)) for s in text.values())
          def fm(rx):
            r=re.compile(rx,re.I); return [p for p in text if r.search(p)]
          inv={'source_files':len(files),'screens_pages':len(fm(r'/(screens?|pages?)/|_(screen|page)\.dart$')),'widgets_components':len(fm(r'/(widgets?|components?)/|_widget\.dart$')),'forms':n(r'\b(TextFormField|TextField|Form\s*\()'),'buttons':n(r'\b(ElevatedButton|TextButton|OutlinedButton|IconButton|InkWell|GestureDetector)\b'),'dialogs_sheets':n(r'\b(Dialog|showDialog|showModalBottomSheet|Get\.dialog|Get\.bottomSheet)\b'),'loaders':n(r'\b(CircularProgressIndicator|LinearProgressIndicator|Shimmer|Lottie)\b'),'animations':n(r'\b(Animated\w+|AnimationController|Tween|Hero|FadeTransition|SlideTransition|ScaleTransition)\b'),'safe_area':n(r'\bSafeArea\s*\('),'scaffold':n(r'\bScaffold\s*\('),'text_overflow':n(r'TextOverflow\.'),'expanded_flexible':n(r'\b(Expanded|Flexible)\s*\('),'uppercase_calls':n(r'\.toUpperCase\(\)'),'print_calls':n(r'(?<!debug)\bprint\s*\('),'hardcoded_font_sizes':n(r'fontSize\s*:\s*(?:const\s+)?\d+(?:\.\d+)?'),'fixed_width_height_literals':n(r'\b(?:width|height)\s*:\s*(?:const\s+)?\d{2,}(?:\.\d+)?')}
          risks=[]
          for p,s in text.items():
            score=0; sig=[]
            for tag,rx,w in [('print',r'(?<!debug)\bprint\s*\(',2),('uppercase',r'\.toUpperCase\(\)',1),('hardcoded_font',r'fontSize\s*:\s*(?:const\s+)?(?:2[0-9]|[3-9][0-9])',2),('fixed_dimension',r'\b(?:width|height)\s*:\s*(?:const\s+)?(?:[2-9]\d\d|\d{4,})',2),('stack_positioned',r'\bStack\s*\(|\bPositioned\s*\(',1)]:
              c=len(re.findall(rx,s));
              if c: score+=min(c,5)*w; sig.append(f'{tag}:{c}')
            if score>=4: risks.append({'file':p,'score':score,'signals':sig})
          risks.sort(key=lambda x:(-x['score'],x['file']))
          report={'inventory':inv,'files':sorted(text),'high_risk_files':risks}
          Path('audit-static.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: App analyzer gate
        shell: bash
        run: |
          set +e
          flutter analyze lib test --no-fatal-warnings --no-fatal-infos 2>&1 | tee app-analyze.txt
          echo ${PIPESTATUS[0]} > app-analyze.exit
          exit 0
      - name: Full repository analyzer report
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee full-analyze.txt
          echo ${PIPESTATUS[0]} > full-analyze.exit
          exit 0
      - name: Flutter tests
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.txt
          echo ${PIPESTATUS[0]} > flutter-test.exit
          exit 0
      - name: Android debug build smoke test
        shell: bash
        run: |
          set +e
          flutter build apk --debug --no-pub 2>&1 | tee android-build.txt
          echo ${PIPESTATUS[0]} > android-build.exit
          exit 0
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Production QA Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- App analyzer exit: $(cat app-analyze.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full repository analyzer exit: $(cat full-analyze.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests exit: $(cat flutter-test.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android debug build exit: $(cat android-build.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -160 audit-static.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-audit
          path: |
            audit-static.json
            app-analyze.txt
            app-analyze.exit
            full-analyze.txt
            full-analyze.exit
            flutter-test.txt
            flutter-test.exit
            android-build.txt
            android-build.exit
      - name: Quality gate
        if: always()
        shell: bash
        run: |
          fail=0
          for f in app-analyze.exit flutter-test.exit android-build.exit; do
            if [ ! -f "$f" ] || [ "$(cat "$f")" != "0" ]; then echo "FAIL: $f=$(cat "$f" 2>/dev/null || echo missing)"; fail=1; fi
          done
          exit "$fail"
