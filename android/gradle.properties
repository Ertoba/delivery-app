org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.41 still integrates through the legacy AGP DSL and Kotlin plugin.
android.newDsl=false
android.builtInKotlin=false

# Build each Play AAB sequentially on the 8 GiB Windows workstation.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
